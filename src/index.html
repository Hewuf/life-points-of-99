<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人生只有99个点</title>
  <link rel="preconnect" href="https://fonts.font.im" crossorigin>
  <link href="https://fonts.font.im/css2?family=Noto+Serif+SC:wght@300;400;500&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: oklch(9% 0.012 60);
      --surface: oklch(14% 0.012 60);
      --line: oklch(22% 0.01 60);
      --text-primary: oklch(88% 0.01 80);
      --text-secondary: oklch(50% 0.01 80);
      --text-muted: oklch(30% 0.01 60);
      --accent: oklch(76% 0.14 82);
      --accent-dim: oklch(76% 0.14 82 / 0.25);
      --accent-glow: oklch(76% 0.14 82 / 0.12);
      --tweaks-border: oklch(28% 0.01 60);
      --tweaks-divider: oklch(20% 0.01 60);
      --range-track: oklch(28% 0.01 60);
    }

    /* ── Light mode ── */
    html.light {
      --bg: oklch(97% 0.008 80);
      --surface: oklch(93% 0.008 80);
      --line: oklch(78% 0.008 70);
      --text-primary: oklch(18% 0.01 60);
      --text-secondary: oklch(45% 0.01 60);
      --text-muted: oklch(65% 0.008 70);
      --accent: oklch(52% 0.14 82);
      --accent-dim: oklch(52% 0.14 82 / 0.12);
      --accent-glow: oklch(52% 0.14 82 / 0.08);
      --tweaks-border: oklch(82% 0.008 70);
      --tweaks-divider: oklch(88% 0.008 70);
      --range-track: oklch(82% 0.008 70);
    }

    html, body {
      transition: background 0.35s ease, color 0.35s ease;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Noto Serif SC', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 24px 48px;
      display: flex;
      align-items: center;
      gap: 20px;
      background: linear-gradient(to bottom, var(--bg) 70%, transparent);
      pointer-events: none;
    }
    .header-title {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: var(--text-primary);
    }
    .header-sub {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }
    .header-admin {
      margin-left: auto;
      pointer-events: all;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }
    .header-admin:hover { color: var(--text-secondary); }

    .timeline-wrap {
      display: flex;
      justify-content: center;
      padding: 120px 0 160px;
    }

    .timeline {
      position: relative;
      width: 600px;
      max-width: 90vw;
    }

    /* Center vertical line — thickness controlled by JS */
    .timeline::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0; bottom: 0;
      transform: translateX(-50%);
      width: var(--line-width, 2px);
      background: linear-gradient(
        to bottom,
        transparent 0%,
        var(--line) 3%,
        var(--line) 97%,
        transparent 100%
      );
    }

    /* ── Row heights — set by JS via CSS vars ── */
    .year-row {
      position: relative;
      display: flex;
      align-items: center;
      height: var(--row-height, 100px);
    }
    .year-row.future      { height: var(--row-height-future, 64px); }
    .year-row.far-future  { height: var(--row-height-far, 36px); }

    /* Year label */
    .year-label {
      position: absolute;
      right: calc(50% + var(--dot-offset, 36px));
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 300;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      transition: color 0.25s;
      white-space: nowrap;
      text-align: right;
    }
    .year-row.future .year-label,
    .year-row.far-future .year-label { font-size: 11px; color: var(--text-muted); }
    .year-row.current .year-label    { color: var(--accent); }
    .year-row.past:hover .year-label { color: var(--text-primary); }

    /* Age / snippet — right side */
    .age-label {
      position: absolute;
      left: calc(50% + var(--dot-offset, 36px));
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      white-space: nowrap;
      transition: opacity 0.2s;
    }
    .year-row:not(.current):not(.future):not(.far-future):hover .age-label { opacity: 0; }

    .year-snippet {
      position: absolute;
      left: calc(50% + var(--dot-offset, 36px));
      font-size: 12px;
      font-weight: 300;
      color: var(--text-secondary);
      max-width: 200px;
      line-height: 1.5;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .year-row:hover .year-snippet { opacity: 1; transform: translateX(0); }
    .year-row.future .year-snippet,
    .year-row.far-future .year-snippet { display: none; }

    /* ── DOT — sizes set by JS inline style ── */
    .dot-wrap {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 48px; height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
    }
    .year-row.future .dot-wrap,
    .year-row.far-future .dot-wrap { cursor: default; }

    .dot-outer {
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.25s, transform 0.25s, background 0.25s;
      position: relative;
    }
    .dot-inner {
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.25s, transform 0.25s;
    }

    .year-row.has-content .dot-outer { border-color: var(--text-secondary); }
    .year-row.has-content .dot-inner { background: var(--text-secondary); }

    .year-row.past:hover .dot-outer,
    .year-row.has-content:hover .dot-outer {
      border-color: var(--text-primary);
      transform: scale(1.2);
    }
    .year-row.past:hover .dot-inner,
    .year-row.has-content:hover .dot-inner {
      background: var(--text-primary);
    }

    /* Current year dot */
    .year-row.current .dot-outer {
      border-color: var(--accent);
      background: var(--accent-glow);
    }
    .year-row.current .dot-inner { background: var(--accent); }
    .year-row.current .dot-outer::after {
      content: '';
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 1.5px solid var(--accent);
      animation: pulse-ring 2.4s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    .now-badge {
      position: absolute;
      left: calc(50% + var(--dot-offset, 36px));
      top: 50%;
      transform: translateY(-50%);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 2px 7px 2px 8px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .footer-fade {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to top, var(--bg) 40%, transparent);
      pointer-events: none;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

    /* ── Tweaks panel ── */
    #tweaks-panel {
      display: none;
      position: fixed;
      bottom: 28px; right: 28px;
      z-index: 300;
      background: var(--surface);
      border: 1px solid var(--tweaks-border);
      border-radius: 8px;
      padding: 20px 22px 18px;
      width: 248px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: background 0.35s, border-color 0.35s;
    }
    #tweaks-panel.visible { display: block; }

    .tweaks-title {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .tweak-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }
    .tweak-row:last-child { margin-bottom: 0; }

    .tweak-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      flex: 1;
    }

    .tweak-value {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--accent);
      min-width: 32px;
      text-align: right;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      background: var(--range-track);
      border-radius: 2px;
      outline: none;
      flex-shrink: 0;
      transition: background 0.35s;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px; height: 13px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .tweak-divider {
      border: none;
      border-top: 1px solid var(--tweaks-divider);
      margin: 12px 0;
      transition: border-color 0.35s;
    }

    /* ── Mode toggle ── */
    .mode-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .mode-toggle-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
    }
    .toggle-switch {
      position: relative;
      width: 36px; height: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toggle-switch input { display: none; }
    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: var(--range-track);
      transition: background 0.25s;
    }
    .toggle-switch input:checked + .toggle-track { background: var(--accent); }
    .toggle-thumb {
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--text-primary);
      transition: transform 0.25s, background 0.35s;
      pointer-events: none;
    }
    .toggle-switch input:checked ~ .toggle-thumb { transform: translateX(16px); background: white; }

    /* ── Language pill ── */
    .lang-pill {
      pointer-events: all;
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--tweaks-border);
      border-radius: 999px;
      padding: 2px;
      background: var(--surface);
      transition: background 0.35s, border-color 0.35s;
    }
    .lang-btn {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      background: none;
      border: none;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
    }
    .lang-btn:hover { color: var(--text-secondary); }
    .lang-btn.active {
      color: var(--bg);
      background: var(--text-primary);
    }
    html.light .lang-btn.active { color: white; background: var(--text-primary); }

    .header-admin { margin-left: 0; }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: all;
    }

    /* mode icon button */
    .mode-icon-btn {
      pointer-events: all;
      background: none;
      border: 1px solid var(--tweaks-border);
      border-radius: 50%;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      margin-left: 10px;
      transition: color 0.2s, border-color 0.2s, background 0.35s;
      flex-shrink: 0;
    }
    .mode-icon-btn:hover { color: var(--text-secondary); border-color: var(--text-muted); }
    #mode-icon-sun  { display: none; }
    #mode-icon-moon { display: block; }
    html.light #mode-icon-sun  { display: block; }
    html.light #mode-icon-moon { display: none; }
  </style>
</head>
<body>

<header class="header">
  <span class="header-title" data-i18n="title">人生只有99个点</span>
  <span class="header-sub">1998 — 2097</span>
  <div class="header-right">
    <div class="lang-pill">
      <button class="lang-btn" data-lang="zh-CN">简</button>
      <button class="lang-btn" data-lang="zh-TW">繁</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
    <button class="mode-icon-btn" id="mode-icon-btn" title="切换主题">
      <svg id="mode-icon-sun" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <svg id="mode-icon-moon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <a href="edit.html" class="header-admin" data-i18n="edit">编辑 →</a>
  </div>
</header>

<div class="timeline-wrap">
  <div class="timeline" id="timeline"></div>
</div>

<div class="footer-fade"></div>

<!-- Tweaks panel -->
<div id="tweaks-panel">
  <div class="tweaks-title" data-i18n="tweaks">Tweaks</div>

  <div class="tweak-row">
    <span class="tweak-label" data-i18n="dotSize">圆圈大小</span>
    <input type="range" id="tw-dot-size" min="16" max="40" step="2">
    <span class="tweak-value" id="tw-dot-size-val"></span>
  </div>

  <div class="tweak-row">
    <span class="tweak-label" data-i18n="innerSize">内点大小</span>
    <input type="range" id="tw-inner-size" min="3" max="16" step="1">
    <span class="tweak-value" id="tw-inner-size-val"></span>
  </div>

  <div class="tweak-row">
    <span class="tweak-label" data-i18n="lineWidth">线条粗细</span>
    <input type="range" id="tw-line-width" min="1" max="6" step="0.5">
    <span class="tweak-value" id="tw-line-width-val"></span>
  </div>

  <hr class="tweak-divider">

  <div class="tweak-row">
    <span class="tweak-label" data-i18n="rowHeight">行间距</span>
    <input type="range" id="tw-row-height" min="56" max="160" step="4">
    <span class="tweak-value" id="tw-row-height-val"></span>
  </div>

  <div class="tweak-row">
    <span class="tweak-label" data-i18n="rowFuture">未来行间距</span>
    <input type="range" id="tw-row-future" min="28" max="80" step="4">
    <span class="tweak-value" id="tw-row-future-val"></span>
  </div>

  <hr class="tweak-divider">

  <div class="mode-toggle">
    <span class="mode-toggle-label" data-i18n="lightMode">浅色模式</span>
    <label class="toggle-switch">
      <input type="checkbox" id="tw-light-mode">
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
  </div>
</div>

<script>
  const BIRTH_YEAR  = 1998;
  const CURRENT_YEAR = new Date().getFullYear();
  const TOTAL_DOTS   = 100;
  const YEARS = Array.from({ length: TOTAL_DOTS }, (_, i) => BIRTH_YEAR + i);

  const SAMPLE_DATA = {
    1998: { snippet: "出生，一切从零开始", snippet_tw: "出生，一切從零開始", snippet_en: "born — everything begins from zero" },
    2000: { snippet: "两岁，记忆的起点", snippet_tw: "兩歲，記憶的起點", snippet_en: "two years old, memory begins" },
    2004: { snippet: "小学，开始认识世界", snippet_tw: "小學，開始認識世界", snippet_en: "primary school, learning the world" },
    2010: { snippet: "初中，青春的躁动", snippet_tw: "初中，青春的躁動", snippet_en: "middle school, the restless years" },
    2013: { snippet: "高中，压力与成长", snippet_tw: "高中，壓力與成長", snippet_en: "high school, pressure and growth" },
    2016: { snippet: "大学，第一次离家", snippet_tw: "大學，第一次離家", snippet_en: "university, first time away from home" },
    2020: { snippet: "疫情元年，困在原地", snippet_tw: "疫情元年，困在原地", snippet_en: "pandemic year, stuck in place" },
    2021: { snippet: "开始认真写东西", snippet_tw: "開始認真寫東西", snippet_en: "started writing seriously" },
    2022: { snippet: "转折的一年", snippet_tw: "轉摺的一年", snippet_en: "the year of turning points" },
    2023: { snippet: "慢慢找到自己的节奏", snippet_tw: "慢慢找到自己的節奨", snippet_en: "slowly finding my rhythm" },
    2024: { snippet: "深度思考，向内探索", snippet_tw: "深度思考，向內探索", snippet_en: "deep thinking, inward exploration" },
    2025: { snippet: "一些事情开始明朗", snippet_tw: "一些事情開始明朗", snippet_en: "some things becoming clear" },
  };

  function getData(year) {
    const s = localStorage.getItem(`life_year_${year}`);
    if (s) { try { return JSON.parse(s); } catch(e) {} }
    return SAMPLE_DATA[year] || null;
  }

  // ── i18n ──
  const I18N = {
    'zh-CN': {
      title: '人生只有99个点',
      edit: '编辑 →',
      future: '未来',
      birth: '出生',
      clickRecord: '— 点击记录这一年',
      tweaks: 'Tweaks',
      dotSize: '圆圈大小',
      innerSize: '内点大小',
      lineWidth: '线条粗细',
      rowHeight: '行间距',
      rowFuture: '未来行间距',
      lightMode: '浅色模式',
      snippetKey: 'snippet',
    },
    'zh-TW': {
      title: '人生只有99個點',
      edit: '編輯 →',
      future: '未來',
      birth: '出生',
      clickRecord: '— 點擊記錄這一年',
      tweaks: 'Tweaks',
      dotSize: '圓圈大小',
      innerSize: '內點大小',
      lineWidth: '線條粗細',
      rowHeight: '行間距',
      rowFuture: '未來行間距',
      lightMode: '淺色模式',
      snippetKey: 'snippet_tw',
    },
    'en': {
      title: '99 Dots of Life',
      edit: 'Edit →',
      future: 'next',
      birth: 'birth',
      clickRecord: '— click to record this year',
      tweaks: 'Tweaks',
      dotSize: 'Dot size',
      innerSize: 'Inner dot',
      lineWidth: 'Line width',
      rowHeight: 'Row gap',
      rowFuture: 'Future gap',
      lightMode: 'Light mode',
      snippetKey: 'snippet_en',
    },
  };

  let currentLang = localStorage.getItem('life_lang') || 'zh-CN';
  if (!I18N[currentLang]) currentLang = 'zh-CN';

  function t(key) { return I18N[currentLang][key] ?? key; }

  function applyI18n() {
    document.documentElement.lang = currentLang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === currentLang);
    });
  }

  // ── Tweakable defaults ──
  const T = /*EDITMODE-BEGIN*/{
    "dotSize": 40,
    "innerSize": 16,
    "lineWidth": 6,
    "rowHeight": 160,
    "rowFuture": 28
  }/*EDITMODE-END*/;

  function applyTweaks(t) {
    const root = document.documentElement;
    const offset = Math.round(t.dotSize / 2) + 14;
    root.style.setProperty('--line-width',        t.lineWidth + 'px');
    root.style.setProperty('--row-height',         t.rowHeight + 'px');
    root.style.setProperty('--row-height-future',  t.rowFuture + 'px');
    root.style.setProperty('--row-height-far',     Math.round(t.rowFuture * 0.6) + 'px');
    root.style.setProperty('--dot-offset',         offset + 'px');

    // Update all dots
    document.querySelectorAll('.dot-outer').forEach(el => {
      const row = el.closest('.year-row');
      let sz = t.dotSize, inner = t.innerSize;
      if (row.classList.contains('current')) {
        sz    = Math.round(t.dotSize * 1.25);
        inner = Math.round(t.innerSize * 1.3);
      } else if (row.classList.contains('future')) {
        sz    = Math.round(t.dotSize * 0.55);
        inner = Math.round(t.innerSize * 0.55);
      } else if (row.classList.contains('far-future')) {
        sz    = Math.round(t.dotSize * 0.38);
        inner = Math.round(t.innerSize * 0.38);
      }
      el.style.width  = sz + 'px';
      el.style.height = sz + 'px';
      const di = el.querySelector('.dot-inner');
      if (di) { di.style.width = inner + 'px'; di.style.height = inner + 'px'; }
    });

    // Update NOW badge offset
    document.querySelectorAll('.now-badge').forEach(b => {
      b.style.left = `calc(50% + ${offset + t.dotSize * 0.6}px)`;
    });
  }

  // ── Build timeline ──
  function buildTimeline() {
    const container = document.getElementById('timeline');
    const yearsDesc = [...YEARS].reverse();

    yearsDesc.forEach(year => {
      const age        = year - BIRTH_YEAR;
      const isCurrent  = year === CURRENT_YEAR;
      const isFarFuture = year > CURRENT_YEAR + 1;
      const isFuture   = year > CURRENT_YEAR;
      const isPast     = year < CURRENT_YEAR;
      const isNextYear = year === CURRENT_YEAR + 1;
      const isBirth    = year === BIRTH_YEAR;
      const data       = getData(year);
      const hasContent = !!data;

      const row = document.createElement('div');
      row.className = 'year-row';
      row.dataset.year = year;
      row.id = `year-${year}`;

      if (isCurrent)       row.classList.add('current');
      else if (isFarFuture) row.classList.add('far-future');
      else if (isFuture)   row.classList.add('future');
      else {
        row.classList.add('past');
        if (hasContent) row.classList.add('has-content');
      }

      // Year label
      const label = document.createElement('div');
      label.className = 'year-label';
      label.textContent = year;
      if (isNextYear) {
        const note = document.createElement('span');
        note.style.cssText = 'font-family:"DM Mono",monospace;font-size:9px;color:var(--text-muted);margin-left:6px;opacity:0.6;';
        note.textContent = t('future');
        label.appendChild(note);
      }
      row.appendChild(label);

      // Dot
      const dotWrap  = document.createElement('div'); dotWrap.className = 'dot-wrap';
      const dotOuter = document.createElement('div'); dotOuter.className = 'dot-outer';
      const dotInner = document.createElement('div'); dotInner.className = 'dot-inner';
      dotOuter.appendChild(dotInner);
      dotWrap.appendChild(dotOuter);
      row.appendChild(dotWrap);

      // NOW badge
      if (isCurrent) {
        const badge = document.createElement('div');
        badge.className = 'now-badge';
        badge.textContent = 'NOW';
        row.appendChild(badge);
      }

      // Age label
      if (!isFuture && !isFarFuture) {
        const ageEl = document.createElement('div');
        ageEl.className = 'age-label';
        ageEl.textContent = isBirth ? `age 0 · ${t('birth')}` : String(age);
        row.appendChild(ageEl);
      }

      // Snippet
      if (!isFuture && !isFarFuture) {
        const snip = document.createElement('div');
        snip.className = 'year-snippet';
        const key = I18N[currentLang].snippetKey;
        const text = data?.[key] || data?.snippet;
        if (text) {
          snip.textContent = text;
        } else if (!isCurrent) {
          snip.textContent = t('clickRecord');
          snip.style.color = 'var(--text-muted)';
        }
        row.appendChild(snip);
      }

      // Click
      if (!isFuture && !isFarFuture) {
        row.style.cursor = 'pointer';
        row.addEventListener('click', () => { window.location.href = `detail.html?year=${year}`; });
      }

      container.appendChild(row);
    });
  }

  buildTimeline();
  applyTweaks(T);
  applyI18n();

  // Language switcher
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem('life_lang', currentLang);
      // Rebuild timeline for translated snippets
      document.getElementById('timeline').innerHTML = '';
      buildTimeline();
      applyTweaks(T);
      applyI18n();
    });
  });

  // Scroll to current year
  requestAnimationFrame(() => {
    const el = document.getElementById(`year-${CURRENT_YEAR}`);
    if (el) {
      const offset = el.getBoundingClientRect().top + window.scrollY - window.innerHeight / 2;
      window.scrollTo({ top: offset, behavior: 'instant' });
    }
  });

  // ── Tweaks wiring ──
  const sliders = [
    { id: 'tw-dot-size',   key: 'dotSize',   valId: 'tw-dot-size-val',   unit: 'px' },
    { id: 'tw-inner-size', key: 'innerSize',  valId: 'tw-inner-size-val', unit: 'px' },
    { id: 'tw-line-width', key: 'lineWidth',  valId: 'tw-line-width-val', unit: 'px' },
    { id: 'tw-row-height', key: 'rowHeight',  valId: 'tw-row-height-val', unit: 'px' },
    { id: 'tw-row-future', key: 'rowFuture',  valId: 'tw-row-future-val', unit: 'px' },
  ];

  function syncSliders() {
    sliders.forEach(({ id, key, valId, unit }) => {
      const el = document.getElementById(id);
      el.value = T[key];
      document.getElementById(valId).textContent = T[key] + unit;
    });
  }

  sliders.forEach(({ id, key, valId, unit }) => {
    document.getElementById(id).addEventListener('input', e => {
      T[key] = parseFloat(e.target.value);
      document.getElementById(valId).textContent = T[key] + unit;
      applyTweaks(T);
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { ...T } }, '*');
    });
  });

  syncSliders();

  // ── Light/dark mode ──
  function applyMode(isLight) {
    document.documentElement.classList.toggle('light', isLight);
    document.getElementById('tw-light-mode').checked = isLight;
    localStorage.setItem('life_theme', isLight ? 'light' : 'dark');
  }

  // Restore saved preference
  applyMode(localStorage.getItem('life_theme') === 'light');

  document.getElementById('tw-light-mode').addEventListener('change', e => {
    applyMode(e.target.checked);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { ...T } }, '*');
  });

  // Header icon toggle
  document.getElementById('mode-icon-btn').addEventListener('click', () => {
    const isLight = !document.documentElement.classList.contains('light');
    applyMode(isLight);
  });

  // Tweaks toggle
  window.addEventListener('message', e => {
    if (e.data?.type === '__activate_edit_mode')   document.getElementById('tweaks-panel').classList.add('visible');
    if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('visible');
  });
  window.parent.postMessage({ type: '__edit_mode_available' }, '*');
</script>
</body>
</html>
